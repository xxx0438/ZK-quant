[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-api"
version = "0.4.1"
description = "Echo Protocol API — decentralized quant fund infrastructure."
requires-python = ">=3.11"
authors = [{ name = "Echo Protocol", email = "dev@echo.ai" }]
license = { text = "MIT" }

dependencies = [
    # Web
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27",
    "starlette>=0.36",
    # DB
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",  # alembic offline mode
    # Cache / queues
    "redis>=5.0",
    # Config / validation
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1,<5.0",  # pin to avoid passlib warning
    # HTTP client
    "httpx>=0.27",
    # Crypto / blockchain
    "web3>=6.15,<7.0",
    "eth-account>=0.11",
    # Observability
    "sentry-sdk[fastapi]>=1.40",
    "posthog>=3.0",
    # Utilities
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    "types-redis",
    "httpx>=0.27",  # for TestClient
    "faker>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101", "S104", "S105", "S106", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["E", "F"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
