name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - working-directory: apps/api
        run: |
          pip install -e .[dev]
          alembic upgrade head
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://echo:echo@localhost:5432/echo_test
          REDIS_URL: redis://localhost:6379

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - working-directory: apps/api
        run: |
          pip install ruff black
          ruff check .
          black --check .

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.echo.ai
