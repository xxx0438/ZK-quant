[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-data"
version = "0.4.3"
description = "Echo Protocol canonical data layer — snapshots, history, datasets."
requires-python = ">=3.11"
dependencies = [
    "echo-quant>=0.4.3",           # share Inputs / OHLCV schema
    "pydantic>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["echo_data"]
